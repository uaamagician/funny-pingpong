<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1033" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%23ffd23f%27/%3E%3C/svg%3E" />
  <title>乒乓大亂鬥</title>
  <style>
    :root { --gold:#ffd23f; --pink:#ff4f8b; --ink:#1b1033; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:var(--ink); overflow:hidden; font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; color:#fff; }
    #app { position:fixed; inset:0; touch-action:none; user-select:none; -webkit-user-select:none; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .hud { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 10px) 16px 0; display:flex; justify-content:center; pointer-events:none; }
    .score { display:flex; align-items:center; gap:14px; background:rgba(20,10,45,.7); border:2px solid rgba(255,255,255,.18); border-radius:18px; padding:6px 18px; font-weight:900; }
    .score b { font-size:34px; min-width:28px; text-align:center; }
    .score small { display:block; font-size:11px; opacity:.7; font-weight:600; text-align:center; }
    .score .sep { font-size:24px; opacity:.6; }
    .serve-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--gold); margin-left:4px; visibility:hidden; }
    .serve-dot.on { visibility:visible; }
    .rally { position:absolute; top:calc(env(safe-area-inset-top) + 74px); left:0; right:0; text-align:center; font-size:13px; opacity:.75; pointer-events:none; }
    .pop { position:absolute; left:0; right:0; top:30%; text-align:center; font-size:44px; font-weight:900; color:var(--gold); text-shadow:0 4px 0 #8a3a00, 0 0 24px rgba(255,150,0,.7); pointer-events:none; opacity:0; transform:scale(.5); }
    .pop.show { animation: pop 1s ease-out forwards; }
    @keyframes pop { 0%{opacity:0;transform:scale(.4) rotate(-6deg)} 15%{opacity:1;transform:scale(1.2) rotate(3deg)} 30%{transform:scale(1) rotate(0)} 80%{opacity:1} 100%{opacity:0;transform:scale(1) translateY(-30px)} }
    .swipefx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
    .hitring { position:absolute; display:none; transform:translate(-50%,-50%); border:4px solid #7dff9a; border-radius:50%; box-shadow:0 0 18px #7dff9a, inset 0 0 14px rgba(125,255,154,.45); pointer-events:none; z-index:1; animation:ringpulse .5s ease-in-out infinite alternate; }
    .hitring::after { content:attr(data-hand); position:absolute; top:-26px; left:50%; transform:translateX(-50%); font-weight:900; font-size:14px; color:#fff; text-shadow:0 2px 0 #000; white-space:nowrap; }
    .timering { position:absolute; display:none; transform:translate(-50%,-50%); border:3px solid rgba(255,255,255,.85); border-radius:50%; pointer-events:none; z-index:1; }
    .timering.perfect { border-color:#ffd23f; box-shadow:0 0 14px #ffd23f; }
    .timering::after { content:attr(data-t); position:absolute; bottom:-24px; left:50%; transform:translateX(-50%); font-size:13px; font-weight:800; color:#fff; text-shadow:0 2px 0 #000; white-space:nowrap; }
    .timering.perfect::after { color:#ffd23f; }
    .shotinfo { position:absolute; display:none; flex-direction:column; align-items:center; gap:2px; left:50%; top:calc(env(safe-area-inset-top) + 82px); transform:translateX(-50%); background:rgba(20,10,45,.82); border:2px solid rgba(255,255,255,.25); border-radius:14px; padding:6px 14px; pointer-events:none; z-index:2; max-width:92vw; text-align:center; }
    .shotinfo b { font-size:17px; color:#ffd23f; }
    .shotinfo span { font-size:12px; opacity:.9; }
    .hitring::before { content:''; position:absolute; inset:30%; border:2px dashed rgba(255,255,255,.75); border-radius:50%; } /* 甜蜜點：滑過這裡最準 */
    .hitring.gold { border-color:#ffd23f; box-shadow:0 0 22px #ffd23f, inset 0 0 16px rgba(255,210,63,.55); }
    .hitring.touch { background:rgba(255,255,255,.25); }
    @keyframes ringpulse { from { opacity:.65; scale:.94; } to { opacity:1; scale:1.04; } }
    .replaytag { position:absolute; display:none; left:50%; top:calc(env(safe-area-inset-top) + 82px); transform:translateX(-50%); background:rgba(20,10,45,.8); border:2px solid #ffd23f; color:#ffd23f; font-weight:900; padding:6px 16px; border-radius:999px; font-size:15px; pointer-events:none; z-index:2; white-space:nowrap; }
    .replaytag small { color:#fff; opacity:.75; font-weight:600; }
    .spintag { position:absolute; display:none; transform:translateX(-50%); font-weight:900; font-size:20px; text-shadow:0 2px 0 #000, 0 0 10px currentColor; pointer-events:none; white-space:nowrap; z-index:2; }
    .hint { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 18px); text-align:center; font-size:14px; opacity:.85; pointer-events:none; padding:0 24px; text-shadow:0 2px 6px #000; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:radial-gradient(ellipse at center, rgba(60,20,110,.85), rgba(15,5,35,.95)); padding:24px; text-align:center; }
    .overlay.hidden { display:none; }
    h1 { margin:0; font-size:48px; line-height:1.05; font-weight:900; color:#fff; text-shadow:0 5px 0 var(--pink), 0 0 30px rgba(255,79,139,.6); transform:rotate(-3deg); }
    .sub { opacity:.8; font-size:14px; margin-bottom:8px; }
    .btn { appearance:none; border:3px solid #3a1d00; background:linear-gradient(#ffe27a,var(--gold)); color:#3a1d00; font-weight:900; font-size:20px; padding:14px 40px; border-radius:18px; box-shadow:0 6px 0 #8a5a00; cursor:pointer; }
    .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #8a5a00; }
    .btn.alt { background:linear-gradient(#ff8fb4,var(--pink)); color:#fff; border-color:#4a0020; box-shadow:0 6px 0 #8a1040; }
    .diff { display:flex; gap:8px; }
    .diff button { appearance:none; border:2px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; padding:8px 16px; border-radius:12px; font-size:15px; font-weight:700; }
    .diff button.on { background:var(--pink); border-color:#fff; }
    .profile { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); border-radius:999px; padding:6px 16px; font-size:14px; font-weight:700; margin-bottom:6px; }
    .profile small { opacity:.7; font-weight:600; margin-right:6px; }
    .hud.hidden { display:none; }
    .editor { position:absolute; left:0; right:0; bottom:0; }
    .editor.hidden { display:none; }
    .sheet { max-height:46vh; overflow-y:auto; background:rgba(20,10,45,.94); border-top:2px solid rgba(255,255,255,.2); border-radius:22px 22px 0 0; padding:14px 16px calc(env(safe-area-inset-bottom) + 14px); -webkit-overflow-scrolling:touch; touch-action:pan-y; }
    .sheet h3 { margin:6px 0 8px; font-size:15px; color:var(--gold); }
    .sheet .row { display:flex; align-items:center; gap:12px; margin:8px 0; font-size:14px; }
    .sheet .row > span:first-child { width:72px; flex:none; opacity:.9; }
    .sheet input[type=range] { flex:1; accent-color:var(--pink); height:28px; }
    .sheet input[type=checkbox] { width:22px; height:22px; accent-color:var(--pink); }
    .swatches { display:flex; flex-wrap:wrap; gap:8px; }
    .sheet .row.sw > span:first-child { width:40px; }
    .swatches { gap:6px; flex:1; }
    .swatch { width:27px; height:27px; border-radius:50%; border:3px solid rgba(255,255,255,.25); padding:0; }
    .swatch.on { border-color:#fff; box-shadow:0 0 0 2px var(--pink); }
    .bar { display:flex; gap:10px; margin-top:14px; position:sticky; bottom:-14px; padding:10px 0 4px; background:linear-gradient(transparent, rgba(20,10,45,.97) 30%); }
    .btn.small { flex:1; font-size:16px; padding:10px 0; border-radius:14px; box-shadow:0 4px 0 #8a5a00; }
    .btn.small.alt { box-shadow:0 4px 0 #8a1040; }
    .btn.gray { background:linear-gradient(#b9b3c9,#8f88a3); color:#fff; border-color:#2a2540; box-shadow:0 4px 0 #4a4560; }
    .score.hidden { display:none; }
    .quit { position:absolute; left:12px; top:calc(env(safe-area-inset-top) + 14px); width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.3); background:rgba(20,10,45,.7); color:#fff; font-size:18px; z-index:3; }
    .quit.hidden { display:none; }
    h2 { margin:0; font-size:34px; font-weight:900; text-shadow:0 4px 0 var(--pink); }
    .card { appearance:none; width:min(320px,100%); text-align:left; border:3px solid rgba(255,255,255,.25); background:linear-gradient(135deg, rgba(255,79,139,.35), rgba(76,201,240,.25)); color:#fff; border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; }
    .card b { font-size:20px; }
    .card span { font-size:13px; opacity:.85; }
    .card:active { transform:scale(.98); }
    .arena { appearance:none; width:100%; display:flex; align-items:center; gap:12px; text-align:left; margin:8px 0; padding:10px 12px; border-radius:14px; border:3px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; }
    .arena.on { border-color:var(--gold); background:rgba(255,210,63,.12); }
    .arena .sw4 { display:grid; grid-template-columns:1fr 1fr; width:48px; height:48px; border-radius:10px; overflow:hidden; flex:none; }
    .arena .sw4 i { display:block; }
    .arena .at { display:flex; flex-direction:column; gap:2px; }
    .arena small { opacity:.75; font-size:12px; }
    .help { font-size:13px; opacity:.8; line-height:1.7; max-width:320px; text-align:left; background:rgba(0,0,0,.25); padding:10px 14px; border-radius:12px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud hidden" id="hud">
      <div class="score match">
        <div><small>你<span class="serve-dot" id="dotP"></span></small><b id="sP">0</b></div>
        <span class="sep">:</span>
        <div><small>對手<span class="serve-dot" id="dotA"></span></small><b id="sA">0</b></div>
      </div>
      <div class="score drill hidden" id="drillHud">
        <div><small>連續命中</small><b id="sStreak">0</b></div>
        <span class="sep">|</span>
        <div><small>最佳</small><b id="sBest">0</b></div>
      </div>
    </div>
    <button class="quit hidden" id="quitBtn" aria-label="離開">✕</button>
    <div class="rally" id="rally"></div>
    <canvas class="swipefx" id="swipeFx"></canvas>
    <div class="timering" id="timeRing"></div>
    <div class="hitring" id="hitRing"></div>
    <div class="shotinfo" id="shotInfo"></div>
    <div class="replaytag" id="replayTag">🔍 回放　<small>點一下跳過</small></div>
    <div class="pop" id="pop"></div>
    <div class="spintag" id="spinTag"></div>
    <div class="hint" id="hint"></div>

    <div class="overlay" id="menu">
      <h1>乒乓<br/>大亂鬥</h1>
      <div class="sub">手指一揮，殺球、旋球、吊球</div>
      <div class="profile" id="profile"></div>
      <button class="btn" id="practiceBtn">AI 對練</button>
      <button class="btn alt" id="editBtn">改造型</button>
      <button class="btn gray" id="arenaBtn">場地：<span id="arenaName"></span></button>
    </div>

    <div class="overlay hidden" id="practice">
      <h2>AI 對練</h2>
      <div class="sub">難度</div>
      <div class="diff" id="diff">
        <button data-d="easy">簡單</button>
        <button data-d="normal" class="on">普通</button>
        <button data-d="hard">困難</button>
      </div>
      <button class="card" id="matchBtn"><b>對戰 AI</b><span>11 分制、輪流發球，完整比賽</span></button>
      <button class="card" id="drillBtn"><b>發球機練習</b><span>無限發球、不計分，專心練手感與旋球</span></button>
      <div class="help">
        <b>發球：</b>在球上點一下＝一般發球；往上滑＝上旋、往下滑＝下旋、劃弧線＝側旋<br/>
        <b>接球：</b>球彈起、出現綠圈時，<b>點一下球＝平擊</b>，或滑過球擊球（越準越好）<br/>
        <b>殺球：</b>球在高處時快速猛滑<br/>
        <b>旋球：</b>滑動時劃出弧線（左弧／右弧）<br/>
        <b>吊球：</b>輕輕短滑　<b>切球：</b>向下滑
      </div>
      <button class="btn gray" id="practiceBack">返回</button>
    </div>

    <div class="editor hidden" id="arenaSheet"></div>

    <div class="editor hidden" id="editor"></div>

    <div class="overlay hidden" id="over">
      <h1 id="overTitle">勝利!</h1>
      <div class="sub" id="overScore"></div>
      <button class="btn alt" id="againBtn">再來一局</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
